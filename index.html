<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>달의 위상과 하늘에서의 움직임</title>
<style>
/* ───────── 팔레트: 밤하늘 남색 + 달빛 호박색 + 하늘색 ───────── */
:root{
  color-scheme:dark;
  --ink:#070c1d; --ink2:#13224a;
  --glass:rgba(12,20,44,.58); --line:rgba(255,255,255,.14);
  --text:#eef3ff; --sub:rgba(238,243,255,.76);
  --acc:#ffc861; --cool:#7cc7ff;
  --moon-a:#fff6dc; --moon-b:#cdb27c;
  --ocean:#2a6db5; --land:#5f9470; --sand:#b9a36f; --ice:#eef5fc;
  --sky-n0:#02050d; --sky-n1:#12234d; --sky-d0:#3d79b8; --sky-d1:#c3dcf1; --warm:#ff9a4d;
  --hill-n0:#0d1730; --hill-n1:#08101f; --hill-n2:#04080f;
  --hill-d0:#8aa7c6; --hill-d1:#52698a; --hill-d2:#2b3b52;
  --r-card:20px; --r-pill:999px; --touch:44px;
  --font:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --cap-h:56px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;background:var(--ink);color:var(--text);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:none}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#cv:active{cursor:grabbing}
button{font-family:var(--font);color:var(--text);cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--cool);outline-offset:2px}

.glass{background:var(--glass);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);
  box-shadow:0 6px 24px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.06)}
.pill{border-radius:var(--r-pill)}

#tabs{position:absolute;top:12px;left:12px;display:flex;gap:2px;padding:4px}
.tab{height:var(--touch);padding:0 18px;border-radius:var(--r-pill);font-size:14px;font-weight:600;color:var(--sub);
  transition:background .25s var(--ease),color .25s var(--ease)}
.tab.on{background:var(--text);color:var(--ink)}

#tr{position:absolute;top:12px;right:12px;display:flex;gap:8px;align-items:center}
.circ{width:var(--touch);height:var(--touch);border-radius:50%;display:grid;place-items:center}
.circ svg{width:18px;height:18px}
#thBtn{height:var(--touch);padding:0 18px;border-radius:var(--r-pill);font-size:14px;font-weight:600;
  transition:background .25s var(--ease),color .25s var(--ease)}
#thBtn.on{background:var(--text);color:var(--ink)}

/* 보조 그림: 바탕은 3D 화면 안에서 그리고, 글자만 DOM으로 올린다 */
.inset{position:absolute;pointer-events:none;text-align:center}
.inset .caption{position:absolute;left:0;right:0;top:8px;font-size:13px;color:var(--sub);line-height:1.3}
#phName{position:absolute;left:0;right:0;bottom:6px;font-size:15px;font-weight:600;color:var(--acc);height:22px;line-height:22px}

#zoom{position:absolute;right:12px;top:calc(50% + 54px);transform:translateY(-50%);display:flex;flex-direction:column;gap:2px;padding:4px}
#zoom button{width:var(--touch);height:var(--touch);border-radius:50%;display:grid;place-items:center;transition:background .2s}
#zoom button:active{background:rgba(255,255,255,.14)}
#zoom svg{width:18px;height:18px}

#seg{position:absolute;left:50%;bottom:calc(14px + var(--cap-h) + 8px);transform:translateX(-50%);display:flex;gap:2px;padding:4px;
  max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none}
#seg::-webkit-scrollbar{display:none}
#seg button{height:var(--touch);padding:0 14px;border-radius:var(--r-pill);font-size:14px;font-weight:600;color:var(--sub);white-space:nowrap;
  transition:background .25s var(--ease),color .25s var(--ease)}
#seg button i{font-style:normal;font-size:13px;font-weight:500;margin-left:5px;opacity:.8}
#seg button.on{background:rgba(255,200,97,.16);color:var(--acc);box-shadow:inset 0 0 0 1px rgba(255,200,97,.35)}

#cap{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(920px,calc(100% - 24px));min-height:var(--cap-h);
  display:grid;align-items:center;column-gap:8px;padding:6px 8px 6px 6px;
  grid-template-columns:44px minmax(0,1fr) 76px minmax(0,1fr) 84px 68px;
  grid-template-areas:"play ds dl hs hl spd"}
#play{grid-area:play;width:var(--touch);height:var(--touch);border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1)}
#play svg{width:16px;height:16px;pointer-events:none}
#ds{grid-area:ds} #hs{grid-area:hs}
#dl{grid-area:dl} #hl{grid-area:hl}
#spd{grid-area:spd;height:var(--touch);min-width:64px;padding:0 12px;border-radius:var(--r-pill);font-size:13px;font-weight:600;color:var(--sub);background:rgba(255,255,255,.08)}
.rdo{text-align:center;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.sl{min-width:0;width:100%;height:var(--touch);margin:0;background:transparent;-webkit-appearance:none;appearance:none;--p:0%;--fill:var(--acc);touch-action:none}
.sl::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--fill) var(--p),rgba(255,255,255,.2) var(--p))}
.sl::-moz-range-track{height:3px;border-radius:2px;background:rgba(255,255,255,.2)}
.sl::-moz-range-progress{height:3px;border-radius:2px;background:var(--fill)}
.sl::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--text);margin-top:-6.5px;
  box-shadow:0 0 0 4px rgba(255,255,255,.12),0 2px 6px rgba(0,0,0,.4)}
.sl::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--text);box-shadow:0 0 0 4px rgba(255,255,255,.12)}
#hs{--fill:var(--cool)}
@media (max-width:820px){
  :root{--cap-h:100px}
  #cap{grid-template-columns:44px minmax(0,1fr) 84px 68px;
    grid-template-areas:"play ds dl spd" "play hs hl spd";padding:4px 8px 4px 6px}
  #seg button i{display:none}
  #seg button{padding:0 11px}
}

#dtBox{position:absolute;top:68px;left:12px;display:none;gap:8px;align-items:center}
#dateIn{height:var(--touch);width:140px;padding:0 12px;border-radius:var(--r-pill);color:var(--text);font:600 14px var(--font);color-scheme:dark;-webkit-user-select:text;user-select:text}
#todayB{height:var(--touch);padding:0 14px;border-radius:var(--r-pill);font-size:13px;font-weight:600;color:var(--sub)}
#hint{position:absolute;left:50%;bottom:calc(14px + var(--cap-h) + 8px + 52px + 10px);transform:translateX(-50%) translateY(6px);padding:9px 16px;font-size:13px;color:var(--text);
  opacity:0;pointer-events:none;transition:opacity .3s ease,transform .3s var(--ease);white-space:nowrap}
#hint.show{opacity:1;transform:translateX(-50%)}
#msg{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:24px;font-size:15px;line-height:1.7;color:var(--sub)}

#drawer{position:absolute;top:12px;bottom:12px;right:12px;width:min(390px,calc(100% - 24px));border-radius:var(--r-card);
  background:rgba(10,16,36,.92);display:flex;flex-direction:column;transform:translateX(calc(100% + 24px));visibility:hidden;
  transition:transform .3s var(--ease),visibility 0s linear .3s;z-index:5}
#drawer.open{transform:none;visibility:visible;transition:transform .3s var(--ease),visibility 0s}
#dh{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 18px;border-bottom:1px solid var(--line)}
#dh h2{margin:0;font-size:16px;font-weight:700;line-height:1.35}
#db{flex:1;overflow-y:auto;padding:16px 18px 10px;touch-action:pan-y;-webkit-user-select:text;user-select:text}
#db ul{margin:0;padding-left:18px;font-size:15px;line-height:1.7}
#db li{margin-bottom:8px}
#db b{color:var(--cool);font-weight:700}
#df{padding:10px 18px 14px;font-size:13px;line-height:1.55;color:var(--sub);border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="msg"></div>

  <div id="tabs" class="glass pill">
    <button class="tab on" data-t="0">우주에서 보기</button>
    <button class="tab" data-t="1">지구에서 보기</button>
  </div>

  <div id="tr">
    <button id="fs" class="glass circ" aria-label="전체 화면"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button id="thBtn" class="glass pill">이론 확인</button>
  </div>

  <div id="ins1" class="inset"><div class="caption">지구에서 본 모습</div><div id="phName"></div></div>
  <div id="ins2" class="inset" style="display:none"><div class="caption">우주에서 본 모습</div></div>

  <div id="dtBox"><input id="dateIn" class="glass pill" type="date" min="1900-01-01" max="2100-12-31" aria-label="양력 날짜"><button id="todayB" class="glass pill">오늘</button></div>

  <div id="zoom" class="glass pill">
    <button id="zin" aria-label="확대"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="zout" aria-label="축소"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
    <button id="zrst" aria-label="원위치"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v4.5h4.5"/></svg></button>
  </div>

  <div id="hint" class="glass pill"></div>
  <div id="seg" class="glass pill"></div>

  <div id="cap" class="glass pill">
    <button id="play" aria-label="재생"></button>
    <input id="ds" class="sl" type="range" min="1" max="30" step="1" value="8" aria-label="음력 날짜">
    <span id="dl" class="rdo"></span>
    <input id="hs" class="sl" type="range" min="0" max="24" step="0.01" value="18" aria-label="시각">
    <span id="hl" class="rdo"></span>
    <button id="spd">빠르게</button>
  </div>

  <aside id="drawer" class="glass" aria-hidden="true">
    <div id="dh"><h2 id="dt"></h2><button id="dx" class="circ" aria-label="닫기"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div id="db"></div>
    <div id="df"></div>
  </aside>
</div>

<script>
/* Three.js r128 (cdnjs). 불러오지 못하면 같은 폴더의 three.min.js를 쓴다. */
(function(){
  function go(){ if(window.THREE) window.__boot&&window.__boot(); }
  function load(src,fail){var s=document.createElement('script');s.src=src;s.onload=go;s.onerror=fail;document.head.appendChild(s);}
  window.__start=function(){
    if(window.THREE)return go();
    load('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',function(){
      load('three.min.js',function(){
        var m=document.getElementById('msg');m.style.display='grid';m.textContent='그래픽 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침해 주세요.';
      });
    });
  };
})();
</script>
<script>
window.__boot=function(){
'use strict';
/* ───────── 좌표계 규약 ─────────
 시간: T = 음력 1일 0시를 0으로 센 경과 일수(0~30). 음력 날짜 = floor(T)+1, 시각 = (T−floor(T))×24.
   지구는 하루(T가 1 늘 때)에 한 바퀴 자전한다 → 한 달 동안 약 30번 자전.
   달은 지구 주위를 29.5일에 한 바퀴 공전한다. φ = T×360/29.5 (0 삭 · 90 상현 · 180 보름 · 270 하현)
   태양 시간각 Hs = (시각−12)×15°.  달 시간각 = Hs − φ.
 [우주에서 보기] 우주 장면: 오른쪽 +x, 위(북극) +y, 화면 아래쪽 +z. 태양은 왼쪽(−x)에서 평행하게 비춘다.
   달의 각(수학 좌표) = 180° + φ, 관측자(서울)의 각 = 180° + Hs. 위에서 볼 때 둘 다 시계 반대 방향.
 [지구에서 보기] 하늘 장면: 동 +x, 위 +y, 남 +z (북 −z). 방위각은 북에서 시계 방향(북 0, 동 90, 남 180, 서 270).
   서울 북위 37.5°. 해·달은 천구 적도 위를 지나는 것으로 단순화한다. 빛은 우주 장면과 같은 태양 방향을 쓴다. */
const THREE=window.THREE;
const TAU=Math.PI*2, D2R=Math.PI/180, R2D=180/Math.PI;
const FONT="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif";
const root=getComputedStyle(document.documentElement);
const C={};
['ink','ink2','text','acc','cool','moon-a','moon-b','ocean','land','sand','ice','warm',
 'sky-n0','sky-n1','sky-d0','sky-d1','hill-n0','hill-n1','hill-n2','hill-d0','hill-d1','hill-d2'].forEach(k=>C[k]=root.getPropertyValue('--'+k).trim());
const hex=h=>{h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]};
const rgba=(h,a)=>{const c=hex(h);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const lerp=(a,b,t)=>a+(b-a)*t;
const $=s=>document.querySelector(s);
const RGB={};Object.keys(C).forEach(k=>RGB[k]=hex(C[k]));
const raw=h=>new THREE.Color(h);                                   // 셰이더용(그대로)
const lin=h=>new THREE.Color(h).convertSRGBToLinear();            // 조명을 받는 재질용

/* ───────── 상태 ───────── */
const PERIOD=29.5, LAT=37.5*D2R, sL=Math.sin(LAT), cL=Math.cos(LAT);
const S={tab:0,T:7.75,playing:false,spd:2,off:0,solar:null};   // off: 실제 달의 위상과 모형 날짜의 차이(일), solar: 양력 날짜 모드
const SPD=[['느리게',1/48],['보통',1/12],['빠르게',1/3]];   // 하루가 흐르는 데 48초 · 12초 · 3초
const V1={yaw:0,elev:62,zoom:1,tyaw:0,telev:62,tzoom:1};
const V2={yaw:180,pitch:22,zoom:1,tyaw:180,tpitch:22,tzoom:1,touched:false};
let dirty=true,W=0,H=0,DPR=1;
const frac=T=>T-Math.floor(T);
const phiDeg=T=>(((T+S.off)*360/PERIOD)%360+360)%360;
const Hsun=T=>(frac(T)-.5)*360;
const PH=[['삭',1],['초승달',4],['상현달',8],['보름달',15],['하현달',23],['그믐달',27]];
function phaseName(T){
  const p=phiDeg(T);
  if(p<20||p>=340)return'삭'; if(p<70)return'초승달'; if(p<110)return'상현달'; if(p<160)return'';
  if(p<200)return'보름달'; if(p<250)return''; if(p<290)return'하현달'; return'그믐달';
}
function hourLabel(h){
  const H=Math.floor(h)%24;
  if(H===0)return'밤 12시'; if(H<6)return'새벽 '+H+'시'; if(H<12)return'오전 '+H+'시'; if(H===12)return'낮 12시';
  if(H<18)return'오후 '+(H-12)+'시'; return'저녁 '+(H-12)+'시';
}
/* 시간각 Hd(도), 적위 dec(라디안)인 천체의 방향 → (동, 북, 위) */
function dirENU(Hd,dec){
  const h=Hd*D2R,sd=Math.sin(dec),cd=Math.cos(dec);
  return[-cd*Math.sin(h),sd*cL-cd*sL*Math.cos(h),sd*sL+cd*cL*Math.cos(h)];
}


/* ───────── 양력 날짜 → 달의 위상 ─────────
 Meeus, Astronomical Algorithms 49장의 새달(삭) 시각 식(주요 항)으로 그 달의 삭 시각을 구한다. 한국 표준시(UTC+9) 기준. */
function jdn(y,m,d){const a=Math.floor((14-m)/12),y2=y+4800-a,m2=m+12*a-3;
  return d+Math.floor((153*m2+2)/5)+365*y2+Math.floor(y2/4)-Math.floor(y2/100)+Math.floor(y2/400)-32045;}
function fromJdn(j){const a=j+32044,b=Math.floor((4*a+3)/146097),c=a-Math.floor(146097*b/4),d=Math.floor((4*c+3)/1461),e=c-Math.floor(1461*d/4),m=Math.floor((5*e+2)/153);
  return{d:e-Math.floor((153*m+2)/5)+1,m:m+3-12*Math.floor(m/10),y:100*b+d-4800+Math.floor(m/10)};}
function newMoonJD(k){
  const T=k/1236.85,T2=T*T,T3=T2*T,T4=T3*T,r=Math.PI/180;
  const jde=2451550.09766+29.530588861*k+.00015437*T2-.00000015*T3+.00000000073*T4;
  const E=1-.002516*T-.0000074*T2;
  const M=(2.5534+29.1053567*k-.0000014*T2-.00000011*T3)*r;
  const Mp=(201.5643+385.81693528*k+.0107582*T2+.00001238*T3-.000000058*T4)*r;
  const F=(160.7108+390.67050284*k-.0016118*T2-.00000227*T3+.000000011*T4)*r;
  const Om=(124.7746-1.56375588*k+.0020672*T2+.00000215*T3)*r;
  const c=-.4072*Math.sin(Mp)+.17241*E*Math.sin(M)+.01608*Math.sin(2*Mp)+.01039*Math.sin(2*F)+.00739*E*Math.sin(Mp-M)-.00514*E*Math.sin(Mp+M)
    +.00208*E*E*Math.sin(2*M)-.00111*Math.sin(Mp-2*F)-.00057*Math.sin(Mp+2*F)+.00056*E*Math.sin(2*Mp+M)-.00042*Math.sin(3*Mp)
    +.00042*E*Math.sin(M+2*F)+.00038*E*Math.sin(M-2*F)-.00024*E*Math.sin(2*Mp-M)-.00017*Math.sin(Om);
  return jde+c;
}
const kstIdx=nm=>Math.floor(nm+9/24+.5);       /* 삭이 일어난 날(한국 날짜)의 번호 */
/* 양력 y-m-d(한국 날짜) → 그날의 음력 날짜 + 위상 보정. 현재 시각(시)은 그대로 둔다. */
function lunarOf(y,m,d,hour){
  const J=jdn(y,m,d);let k=Math.floor((J-2451550.09766)/29.530588861)-1;
  while(kstIdx(newMoonJD(k+1))<=J)k++;
  const nm=newMoonJD(k),day=J-kstIdx(nm)+1,jd=J-.5+hour/24-9/24;
  return{day,age:jd-nm,jdn:J};
}
function applyDate(y,m,d){
  const hr=frac(S.T)*24,L=lunarOf(y,m,d,hr);
  if(L.day<1||L.day>30)return false;
  S.T=(L.day-1)+hr/24;S.off=L.age-S.T;S.solar={jdn:L.jdn,t0:Math.floor(S.T)};S.playing=false;
  return true;
}

    if(i<N){const j=i*2;idx.push(j,j+1,j+2,j+1,j+3,j+2);}
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('k',new THREE.Float32BufferAttribute(k,1));g.setIndex(idx);

const DATA=[
 {title:'달의 공전과 위상 변화',
  theory:['달은 약 한 달(29.5일) 주기로 지구 주위를 <b>공전</b>한다.','지구는 하루에 한 바퀴 <b>자전</b>한다. 그래서 달이 한 번 공전하는 동안 지구는 약 30번 자전한다.','달은 스스로 빛을 낼 수 없어 <b>태양 빛을 받는 부분</b>만 보인다.','태양·지구·달의 위치 관계가 바뀌면 지구에서 보이는 달의 모양이 달라진다. 이렇게 위치에 따라 다르게 보이는 달의 모양을 달의 <b>위상</b>이라고 한다.','달이 태양과 같은 쪽에 있으면 <b>삭</b>, 반대편에 있으면 <b>보름달</b>이다. 태양·지구·달이 직각을 이루고 오른쪽이 밝으면 <b>상현달</b>, 왼쪽이 밝으면 <b>하현달</b>이다.'],
  note:'크기와 거리는 실제와 다릅니다. 음력 날짜와 위상의 대응은 근삿값이며, 대륙의 모양은 단순화한 것입니다.'},
 {title:'지구에서 본 해와 달의 움직임',
  theory:['지구는 서쪽에서 동쪽으로 <b>자전</b>한다.','지구가 자전하기 때문에 해와 달은 하루 동안 <b>동쪽에서 떠서 서쪽으로 지는</b> 것처럼 보인다.','달은 지구 주위를 공전하므로, 음력 날짜가 달라지면 같은 시각에 달이 보이는 <b>위치</b>와 <b>모양</b>이 달라진다.','상현달은 저녁 6시 무렵 남쪽 하늘에 보이고, 보름달은 한밤중에 남쪽 하늘에 보인다.'],
  note:'날짜를 넣으면 그날 한국 시각의 달 모양(위상)을 천문 계산식으로 구합니다(1900~2100년). 다만 하늘에서의 위치는 계절에 따른 해와 달의 높이 차이를 빼고 춘분·추분 무렵으로 단순화했고, 실제와 1시간 안팎 차이가 날 수 있습니다. 서울 기준이며 별의 배치와 언덕은 꾸밈입니다.'}
];
const drawer=$('#drawer'),thBtn=$('#thBtn');
function buildDrawer(){
  const d=DATA[S.tab];
  $('#dt').textContent=d.title;
  $('#db').innerHTML='<ul>'+d.theory.map(t=>'<li>'+t+'</li>').join('')+'</ul>';
  $('#df').textContent=d.note;$('#db').scrollTop=0;
}
function setDrawer(on){
  drawer.classList.toggle('open',on);thBtn.classList.toggle('on',on);drawer.setAttribute('aria-hidden',on?'false':'true');
}
thBtn.onclick=()=>setDrawer(!drawer.classList.contains('open'));
$('#dx').onclick=()=>setDrawer(false);

/* ───────── 하단 조작 ───────── */
const ds=$('#ds'),hs=$('#hs'),dl=$('#dl'),hl=$('#hl'),playB=$('#play'),spdB=$('#spd'),seg=$('#seg');
const ICON_PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>';
const ICON_PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/></svg>';
seg.innerHTML=PH.map((p,i)=>'<button data-i="'+i+'">'+p[0]+'<i>'+p[1]+'일</i></button>').join('');
seg.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  S.T=(PH[+b.dataset.i][1]-1)+frac(S.T);S.off=0;S.solar=null;S.playing=false;sync();
});
const dateIn=$('#dateIn'),pad=n=>String(n).padStart(2,'0');
function showDate(){
  let v='';
  if(S.solar){const j=S.solar.jdn+Math.floor(S.T)-S.solar.t0,o=fromJdn(j);v=o.y+'-'+pad(o.m)+'-'+pad(o.d);}
  if(showDate.v!==v){showDate.v=v;dateIn.value=v;}
}
dateIn.addEventListener('change',()=>{
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(dateIn.value);if(!m)return;
  if(applyDate(+m[1],+m[2],+m[3]))sync();
});
$('#todayB').onclick=()=>{const n=new Date(Date.now()+9*3600e3);if(applyDate(n.getUTCFullYear(),n.getUTCMonth()+1,n.getUTCDate()))sync();};
function setText(el,t){if(el.textContent!==t)el.textContent=t;}
function sync(){
  const day=Math.floor(S.T)+1,hr=frac(S.T)*24;
  ds.value=day;ds.style.setProperty('--p',((day-1)/29*100)+'%');
  hs.value=hr;hs.style.setProperty('--p',(hr/24*100)+'%');
  setText(dl,'음력 '+day+'일');setText(hl,hourLabel(hr));
  if(sync.p!==S.playing){sync.p=S.playing;playB.innerHTML=S.playing?ICON_PAUSE:ICON_PLAY;playB.setAttribute('aria-label',S.playing?'일시정지':'재생');}
  setText(spdB,SPD[S.spd][0]);
  const nm=phaseName(S.T);
  showDate();
  if(sync.n!==nm){sync.n=nm;seg.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',PH[i][0]===nm));}
  dirty=true;
}
ds.addEventListener('input',()=>{S.playing=false;S.T=(parseInt(ds.value,10)-1)+frac(S.T);sync();});
hs.addEventListener('input',()=>{S.playing=false;S.T=Math.floor(S.T)+parseFloat(hs.value)/24;sync();});
hs.addEventListener('change',()=>{S.T=Math.floor(S.T)+(Math.round(parseFloat(hs.value))%24)/24;sync();});
playB.onclick=()=>{S.playing=!S.playing;sync();};
spdB.onclick=()=>{S.spd=(S.spd+1)%3;sync();};

function setTab(i){
  S.tab=i;S.playing=false;S.spd=i===0?2:0;setDrawer(false);
  document.querySelectorAll('.tab').forEach((b,k)=>b.classList.toggle('on',k===i));
  $('#dtBox').style.display=i===1?'flex':'none';$('#ins1').style.display=i===0?'':'none';$('#ins2').style.display=i===1?'':'none';
  buildDrawer();sync();showHint(i);
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{if(+b.dataset.t!==S.tab)setTab(+b.dataset.t);});

const hint=$('#hint'),hinted=[false,false];let hintTimer=0;
function showHint(i){
  if(hinted[i])return;hinted[i]=true;
  hint.textContent=i===0?'화면을 드래그해서 돌려 보세요':'화면을 드래그해서 둘러보세요';
  hint.classList.add('show');clearTimeout(hintTimer);hintTimer=setTimeout(()=>hint.classList.remove('show'),5000);
}
function zoomBy(f){
  if(S.tab===0)V1.tzoom=clamp(V1.tzoom*f,.55,2.6);else V2.tzoom=clamp(V2.tzoom*f,.4,4);
  dirty=true;
}
$('#zin').onclick=()=>zoomBy(1.25);$('#zout').onclick=()=>zoomBy(.8);
$('#zrst').onclick=()=>{
  if(S.tab===0){V1.tyaw=0;V1.telev=62;V1.tzoom=1;}
  else{V2.tyaw=180;V2.tzoom=1;V2.tpitch=defPitch();V2.touched=false;}
  dirty=true;
};
const fsB=$('#fs'),docEl=document.documentElement;
const fsReq=docEl.requestFullscreen||docEl.webkitRequestFullscreen;
if(!fsReq||document.fullscreenEnabled===false)fsB.style.display='none';
fsB.onclick=()=>{
  const cur=document.fullscreenElement||document.webkitFullscreenElement;
  if(cur){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
  else{const p=fsReq.call(docEl);if(p&&p.catch)p.catch(()=>{});}
};

/* 드래그 · 핀치 · 휠 */
const ptrs=new Map();let pinch=0;
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){const a=[...ptrs.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}
  if(drawer.classList.contains('open'))setDrawer(false);
});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===1){
    if(S.tab===0){V1.tyaw-=dx*.008;V1.yaw=V1.tyaw;V1.telev=clamp(V1.telev+dy*.35,18,89);V1.elev=V1.telev;}
    else{
      const k=fovNow()/H;                                    /* 화면에서 1px = 몇 도 */
      V2.yaw=((V2.yaw-dx*k*(H/Math.max(H,W))*Math.max(1,W/H*.0+1))%360+360)%360;V2.tyaw=V2.yaw;
      V2.pitch=clamp(V2.pitch+dy*k,-8,88);V2.tpitch=V2.pitch;V2.touched=true;
    }
    dirty=true;
  }else if(ptrs.size===2){
    const a=[...ptrs.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    if(pinch>0){
      const f=d/pinch;
      if(S.tab===0){V1.tzoom=clamp(V1.tzoom*f,.55,2.6);V1.zoom=V1.tzoom;}else{V2.tzoom=clamp(V2.tzoom*f,.4,4);V2.zoom=V2.tzoom;}
    }
    pinch=d;dirty=true;
  }
});
const endP=e=>{ptrs.delete(e.pointerId);pinch=0;};
cv.addEventListener('pointerup',endP);cv.addEventListener('pointercancel',endP);
cv.addEventListener('wheel',e=>{e.preventDefault();zoomBy(Math.exp(-e.deltaY*.0012));},{passive:false});

/* ───────── 메인 루프 ───────── */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(S.playing){S.T+=dt*SPD[S.spd][1];if(S.T>=30){S.T-=30;S.solar=null;}sync();}
  const f=1-Math.exp(-dt*14);
  const ease=(o,k,tk)=>{const d=o[tk]-o[k];if(Math.abs(d)>1e-4){o[k]+=d*f;dirty=true;}else o[k]=o[tk];};
  ease(V1,'yaw','tyaw');ease(V1,'elev','telev');ease(V1,'zoom','tzoom');
  {let d=((V2.tyaw-V2.yaw+540)%360)-180;if(Math.abs(d)>1e-3){V2.yaw=(V2.yaw+d*f+360)%360;dirty=true;}else V2.yaw=V2.tyaw;}
  ease(V2,'pitch','tpitch');ease(V2,'zoom','tzoom');
  if(dirty){dirty=false;render();}
  requestAnimationFrame(frame);
}
window.addEventListener('resize',resize);
document.addEventListener('fullscreenchange',()=>setTimeout(resize,60));
resize();
setTab(0);
window.__app={S,V1,V2,applyDate,lunarOf,newMoonJD,jdn,fromJdn,setTab,sync,render,resize,renderer,dbg:{space,sky,camMain,bgScene,ovScene,ovCam,INS1,INS2,camMoon,camTop,camSky,renderInset,camMainUpdate,updateSpace},get size(){return{W,H}}};
requestAnimationFrame(frame);
};
window.__start();
</script>
</body>
